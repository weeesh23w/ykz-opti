<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Exitoso! | YKZ Premium</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .success-box {
            background: rgba(155, 48, 255, 0.1);
            border: 1px solid var(--accent-color);
            padding: 50px;
            border-radius: 20px;
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
            animation: fadeInUp 1s ease;
        }
        .license-code {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed var(--accent-color);
            padding: 20px;
            font-family: monospace;
            font-size: 1.5rem;
            color: white;
            margin: 30px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .license-code:hover {
            background: rgba(155, 48, 255, 0.2);
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-box glass">
            <i class="fas fa-check-circle" style="font-size: 4rem; color: var(--accent-color); margin-bottom: 20px;"></i>
            <h1 style="color: white; margin-bottom: 10px;">¡Gracias por tu compra!</h1>
            <p style="color: var(--text-sub);">Ya eres parte de la elite. Tu llave única ha sido activada:</p>
            
            <div class="license-code" id="code-box" onclick="copyCode()">
                CARGANDO...
            </div>
            <p style="font-size: 0.9rem; color: var(--accent-color);">Haz clic para copiar</p>

            <p style="color: var(--text-sub); font-size: 0.8em; margin-top: 15px;">
                * Esta llave es de un solo uso y se vinculará a tu hardware.
            </p>

            <div style="margin-top: 30px;">
                <a href="https://github.com/weeesh23w/ykz-opti/releases/download/V3.1.7/YKZ_ULTIMATE_317.exe" class="glass-toggle" style="padding: 10px 20px;">Descargar v3.1.7</a>
            </div>
        </div>
    </div>

    <script>
        function copyCode() {
            const code = document.getElementById('code-box').innerText;
            if (code === "CARGANDO...") return;
            navigator.clipboard.writeText(code);
            alert('¡Código copiado al portapapeles!');
        }
        
        // Simular carga de key dinámica (v3.1.0)
        setTimeout(() => {
            document.getElementById('code-box').innerText = "YKZ-S3FQ-P033-4W1F";
            document.getElementById('code-box').style.borderStyle = "solid";
        }, 1500);
    </script>
</body>
</html>
